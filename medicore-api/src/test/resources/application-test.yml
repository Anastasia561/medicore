spring:
  flyway:
    enabled: true
    locations:
      - filesystem:${user.dir}/flyway/sql/schema
      - classpath:flyway/sql

  mail:
    host: localhost
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

testcontainers:
  postgres:
    image: postgres:15-alpine
    username: ${TEST_USER:test}
    password: ${TEST_PASSWORD:test}
    database: ${TEST_DB:medicore_test}

app:
  jwt:
    secret: ${JWT_SECRET:test-only-jwt-secret-at-least-32-bytes}
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_TEST:test-bucket}
      region: ${AWS_S3_REGION_TEST:us-east-1}
  salt: ${SALT:test-salt}